<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuuuuunes</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="shortcut icon" href="/assets/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
        }

        .logo-text {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.05rem;
            font-weight: 700;
            background-image: linear-gradient(to right, #ccc, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .active-station {
            background-image: linear-gradient(to right, #ccc, #a78bfa) !important;
        }

        .active-station .station-name-text,
        .active-station .expander-button i {
            color: #1a202c !important;
        }

        .expander-content {
            background-color: #111827 !important;
            color: #9ca3af !important;
        }

        .station-container {
            background-color: #374151;
            transition: all 0.3s ease;
        }

        #station-buttons::-webkit-scrollbar {
            width: 6px;
        }
        #station-buttons::-webkit-scrollbar-track {
            background: transparent;
        }
        #station-buttons::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }

        /* Status indicators */
        .status-spinner { display: none; }
        .loading-station .status-spinner { display: inline-block; }

        .status-eq {
            display: none;
            align-items: flex-end;
            gap: 2px;
        }
        .active-station:not(.loading-station) .status-eq { display: flex; }

        .eq-bar {
            width: 3px;
            height: 4px;
            background-color: #1a202c;
            border-radius: 1px;
            animation: eq-bounce 0.9s ease-in-out infinite;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes eq-bounce {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        /* Error state */
        .error-tag { display: none; }
        .error-station .error-tag { display: flex; }

    </style>
</head>
<body class="bg-gray-900 p-4">
    <div class="bg-gray-800 shadow-2xl rounded-3xl p-6 sm:p-8 w-full max-w-md mx-auto border border-gray-700">

        <div class="flex justify-between items-center mb-6">
            <h1 class="logo-text">Tuuuuunes</h1>
            <button id="random-button" class="flex items-center bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-medium py-2 px-4 rounded-full transition-all shadow-md active:scale-95">
                <i class="fas fa-shuffle mr-2 text-[10px]"></i>
                <span>Random</span>
            </button>
        </div>

        <div>
            <audio id="radio-audio" crossorigin="anonymous"></audio>

            <div id="station-buttons" class="grid grid-cols-1 gap-2 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Stations injected by JS -->
            </div>

            <div class="flex justify-center mt-6 space-x-4">
                <button id="stop-button" class="flex items-center justify-center bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium py-3 px-8 rounded-full transition-all shadow-md active:scale-95">
                    <i class="fas fa-stop mr-2"></i>
                    <span>Stop</span>
                </button>
                <button id="mute-button" class="flex items-center justify-center bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium py-3 px-8 rounded-full transition-all shadow-md active:scale-95">
                    <i id="mute-icon" class="fas fa-volume-up mr-2"></i>
                    <span id="mute-text">Mute</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const radioStations = [
            {
                id: 'rp',
                name: 'Radio Paradise',
                url: 'https://stream.radioparadise.com/aac-128',
                description: 'Legendary eclectic mixes.',
                wiki: 'https://en.wikipedia.org/wiki/Radio_Paradise'
            },
            {
                id: 'fip',
                name: 'FIP',
                url: 'https://icecast.radiofrance.fr/fip-hifi.aac?id=radiofrance',
                description: 'Minimal talk, maximal musical discovery.',
                wiki: 'https://en.wikipedia.org/wiki/FIP_(radio_station)'
            },
            {
                id: 'kcrw',
                name: 'Eclectic 24',
                url: 'https://streams.kcrw.com/e24_mp3',
                description: 'The best of KCRW DJs, streaming 24 hours a day.',
                wiki: 'https://en.wikipedia.org/wiki/KCRW'
            },
            {
                id: 'gs',
                name: 'Groove Salad',
                url: 'https://ice5.somafm.com/groovesalad-128-aac',
                description: 'A nicely chilled plate of ambient beats and grooves.',
                wiki: 'https://en.wikipedia.org/wiki/SomaFM'
            },
            {
                id: 'kexp',
                name: 'KEXP',
                url: 'https://kexp-mp3-128.streamguys1.com/kexp128.mp3',
                description: 'Iconic listener-powered radio from Seattle.',
                wiki: 'https://en.wikipedia.org/wiki/KEXP-FM'
            },
        ];

        const audio = document.getElementById('radio-audio');
        const stationButtonsContainer = document.getElementById('station-buttons');
        const muteButton = document.getElementById('mute-button');
        const stopButton = document.getElementById('stop-button');
        const randomButton = document.getElementById('random-button');
        const muteIcon = document.getElementById('mute-icon');
        const muteText = document.getElementById('mute-text');

        let currentStationId = null;

        function setStationState(stationId, state) {
            document.querySelectorAll('.station-container').forEach(container => {
                const isTarget = stationId && container.dataset.id === stationId;
                container.classList.toggle('active-station', isTarget && (state === 'loading' || state === 'playing'));
                container.classList.toggle('loading-station', isTarget && state === 'loading');
                container.classList.toggle('error-station', isTarget && state === 'error');
            });
        }

        function playStation(station) {
            if (currentStationId === station.id) return;
            currentStationId = station.id;
            setStationState(station.id, 'loading');
            document.title = `Tuuuuunes · ${station.name}`;
            localStorage.setItem('lastStation', station.id);

            audio.src = station.url;
            audio.play().catch(e => {
                if (currentStationId !== station.id) return;
                console.warn('Playback error', e);
                setStationState(station.id, 'error');
                currentStationId = null;
                document.title = 'Tuuuuunes';
                localStorage.removeItem('lastStation');
            });

        }

        audio.onplaying = () => {
            if (currentStationId) setStationState(currentStationId, 'playing');
        };

        function stopStation() {
            audio.pause();
            audio.src = '';
            currentStationId = null;
            setStationState(null, null);
            document.title = 'Tuuuuunes';
        }

        radioStations.forEach(station => {
            const container = document.createElement('div');
            container.className = 'station-container w-full rounded-2xl shadow-md overflow-hidden';
            container.dataset.id = station.id;

            const row = document.createElement('div');
            row.className = 'flex items-center justify-between px-6 py-4 cursor-pointer group hover:bg-white/5 transition-colors';

            const nameBtn = document.createElement('button');
            nameBtn.className = 'station-name-text flex-grow text-left text-lg font-bold text-gray-200 outline-none flex items-center gap-2';
            nameBtn.onclick = () => playStation(station);

            const nameText = document.createElement('span');
            nameText.textContent = station.name;

            const spinner = document.createElement('i');
            spinner.className = 'status-spinner fas fa-spinner fa-spin text-sm';

            const eqBars = document.createElement('div');
            eqBars.className = 'status-eq';
            eqBars.innerHTML = '<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>';

            nameBtn.append(nameText, spinner, eqBars);

            const errorTag = document.createElement('span');
            errorTag.className = 'error-tag items-center text-red-400 text-xs font-medium mr-2 flex-shrink-0';
            errorTag.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i>Unavailable';

            const expBtn = document.createElement('button');
            expBtn.className = 'expander-button text-gray-400 p-2 rounded-full transition-colors outline-none hover:text-white flex-shrink-0';
            expBtn.innerHTML = '<i class="fas fa-plus expander-icon text-sm"></i>';
            expBtn.onclick = (e) => {
                e.stopPropagation();
                const content = container.querySelector('.expander-content');
                const icon = expBtn.querySelector('.expander-icon');
                const isHidden = content.classList.toggle('hidden');
                icon.className = isHidden ? 'fas fa-plus expander-icon text-sm' : 'fas fa-minus expander-icon text-sm';
            };

            const content = document.createElement('div');
            content.className = 'expander-content p-6 text-gray-400 text-xs hidden border-t border-white/5';
            content.innerHTML = `
                <p class="mb-4 leading-relaxed">${station.description}</p>
                <a href="${station.wiki}" target="_blank" class="text-purple-400 font-bold hover:underline">
                    WIKIPEDIA <i class="fas fa-external-link-alt ml-1"></i>
                </a>
            `;

            row.append(nameBtn, errorTag, expBtn);
            container.append(row, content);
            stationButtonsContainer.appendChild(container);
        });

        muteButton.onclick = () => {
            audio.muted = !audio.muted;
            muteIcon.className = audio.muted ? 'fas fa-volume-mute mr-2' : 'fas fa-volume-up mr-2';
            muteText.textContent = audio.muted ? 'Unmute' : 'Mute';
        };

        stopButton.onclick = stopStation;

        randomButton.onclick = () => {
            const others = radioStations.filter(s => s.id !== currentStationId);
            const station = others[Math.floor(Math.random() * others.length)];
            playStation(station);
        };

        // Resume last station — silently discard if browser blocks autoplay
        const lastStationId = localStorage.getItem('lastStation');
        if (lastStationId) {
            const station = radioStations.find(s => s.id === lastStationId);
            if (station) {
                currentStationId = station.id;
                setStationState(station.id, 'loading');
                document.title = `Tuuuuunes · ${station.name}`;
                audio.src = station.url;
                audio.play().catch(() => {
                    setStationState(station.id, null);
                    currentStationId = null;
                    document.title = 'Tuuuuunes';
                });
            }
        }
    </script>
</body>
</html>
