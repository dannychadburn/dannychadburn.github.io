<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punchit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="shortcut icon" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #111827;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    /* ── Logo ─────────────────────────────────────────── */
    .logo {
      font-size: 3.75rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 1.5rem;
      user-select: none;
      background: linear-gradient(90deg, #00ffd0, #009dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      background: #1f2937;
      padding: 2rem;
      border-radius: 1.75rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      width: 100%;
      max-width: 30rem;
      border: 1px solid #374151;
    }

    @media (min-width: 480px) {
      .card { padding: 2.5rem 3rem; }
    }

    /* ── Settings ─────────────────────────────────────── */
    .settings {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .setting-section { width: 100%; }

    .setting-label {
      text-align: center;
      color: #9ca3af;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .btn-group { display: flex; gap: 0.5rem; }

    .toggle-btn {
      flex: 1;
      padding: 0.75rem 0.25rem;
      border-radius: 0.875rem;
      border: 2px solid #4b5563;
      color: #9ca3af;
      font-weight: 700;
      font-size: 0.875rem;
      background: transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .toggle-btn:hover:not(.active) { background: #374151; border-color: #6b7280; }
    .toggle-btn.active {
      border-color: #2dd4bf;
      color: #2dd4bf;
      background: rgba(45, 212, 191, 0.1);
    }

    /* ── Punch legend ─────────────────────────────────── */
    .legend-toggle {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      padding: 0.25rem 0;
      width: 100%;
      text-align: center;
      transition: color 0.15s;
    }
    .legend-toggle:hover { color: #9ca3af; }

    .legend {
      display: none;
      grid-template-columns: auto 1fr auto 1fr;
      gap: 0.35rem 0.75rem;
      font-size: 0.75rem;
      color: #9ca3af;
      padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.875rem;
      border: 1px solid #374151;
      margin-top: 0.5rem;
    }
    .legend.open { display: grid; }
    .legend dt { color: #2dd4bf; font-weight: 800; font-size: 0.8rem; }

    /* ── Active display ───────────────────────────────── */
    #activeDisplay {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    #activeDisplay.hidden { display: none !important; }

    #timer {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 0.5rem;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
      text-align: center;
      width: 100%;
    }
    #timer.timer-teal { color: #2dd4bf; }

    .sequence-wrap {
      height: 8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #sequenceText {
      font-size: 3.5rem;
      font-weight: 900;
      color: #2dd4bf;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    @media (min-width: 480px) {
      #sequenceText { font-size: 4.5rem; }
    }

    /* ── Main button ──────────────────────────────────── */
    #mainButton {
      background: #2dd4bf;
      color: #111827;
      padding: 1.1rem 2rem;
      font-weight: 900;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(45, 212, 191, 0.25);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      width: 100%;
    }
    #mainButton:hover { transform: scale(1.02); box-shadow: 0 12px 32px rgba(45, 212, 191, 0.35); }
    #mainButton:active { transform: scale(0.97); }
    #mainButton.danger {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
    }
    #mainButton.danger:hover { box-shadow: 0 12px 32px rgba(239, 68, 68, 0.35); }

    /* ── Round count ──────────────────────────────────── */
    #roundCount {
      font-size: 1rem;
      font-weight: 700;
      color: #60a5fa;
    }

    /* ── Animations ───────────────────────────────────── */
    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .flash-round { animation: flash 1s infinite; }
    .flash-rest  { animation: flash 1s infinite; }

    /* ── Utility ──────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1 class="logo">Punchit</h1>

  <div class="card">

    <!-- Settings Panel -->
    <div id="settingsPanel" class="settings">

      <div class="setting-section">
        <p class="setting-label">Rest Duration</p>
        <div class="btn-group">
          <button class="toggle-btn rest-btn active" data-value="30">30s</button>
          <button class="toggle-btn rest-btn" data-value="60">60s</button>
        </div>
      </div>

      <div class="setting-section">
        <p class="setting-label">Rounds</p>
        <div class="btn-group">
          <button class="toggle-btn rounds-btn active" data-value="3">3</button>
          <button class="toggle-btn rounds-btn" data-value="6">6</button>
          <button class="toggle-btn rounds-btn" data-value="9">9</button>
          <button class="toggle-btn rounds-btn" data-value="12">12</button>
          <button class="toggle-btn rounds-btn" data-value="0">∞</button>
        </div>
      </div>

      <div class="setting-section">
        <button id="legendToggle" class="legend-toggle">▼ Show punch key</button>
        <dl id="legend" class="legend">
          <dt>1</dt><dd>Jab</dd>
          <dt>2</dt><dd>Cross</dd>
          <dt>3</dt><dd>Left Hook</dd>
          <dt>4</dt><dd>Right Hook</dd>
          <dt>5</dt><dd>Left Uppercut</dd>
          <dt>6</dt><dd>Right Uppercut</dd>
          <dt>7</dt><dd>Left Body</dd>
          <dt>8</dt><dd>Right Body</dd>
          <dt>D</dt><dd>Duck</dd>
          <dt>L</dt><dd>Dodge Left</dd>
          <dt>R</dt><dd>Dodge Right</dd>
          <dt>B</dt><dd>Block</dd>
        </dl>
      </div>

    </div>

    <!-- Active Workout Display -->
    <div id="activeDisplay" class="hidden">
      <p id="timer">0:00</p>
      <div class="sequence-wrap">
        <p id="sequenceText"></p>
      </div>
    </div>

    <!-- Main CTA -->
    <button id="mainButton">Start Workout</button>

    <p id="roundCount">Round 0</p>

  </div>

  <script>
    // ── Configuration ─────────────────────────────────────────────
    const ROUND_TIME  = 180;
    const COMBO_EVERY = 30;
    const START_DELAY = 3;
    const PUNCH_POOL  = { odd: [1, 3, 5, 7], even: [2, 4, 6, 8] };
    const MOVEMENTS   = { D: 'Duck', L: 'Dodge Left', R: 'Dodge Right', B: 'Block' };

    // ── State ─────────────────────────────────────────────────────
    let isRunning          = false;
    let mode               = 'idle'; // idle | delay | round | rest
    let restTime           = 30;
    let roundLimit         = 3;      // 0 = unlimited
    let currentRound       = 0;
    let roundMovementCount = 0;
    let availableVoices    = [];

    let phaseStart       = 0;
    let phaseDuration    = 0;
    let mainInterval     = null;
    let comboInterval    = null;
    let seqTimeouts      = [];
    let restWarnFired    = false;

    // ── DOM ───────────────────────────────────────────────────────
    const mainBtn      = document.getElementById('mainButton');
    const timerEl      = document.getElementById('timer');
    const sequenceEl   = document.getElementById('sequenceText');
    const roundEl      = document.getElementById('roundCount');
    const settingsEl   = document.getElementById('settingsPanel');
    const activeEl     = document.getElementById('activeDisplay');
    const legendToggle = document.getElementById('legendToggle');
    const legendEl     = document.getElementById('legend');

    // ── Voice ─────────────────────────────────────────────────────
    function loadVoices() {
      if (!window.speechSynthesis) return;
      availableVoices = window.speechSynthesis.getVoices()
        .filter(v => v.lang.startsWith('en'));
    }

    function getVoice() {
      return availableVoices[0] || null;
    }

    function preloadVocabulary() {
      if (!window.speechSynthesis) return;
      const vocab = [
        '1','2','3','4','5','6','7','8',
        'Duck','Dodge Left','Dodge Right','Block',
        'Ready','To','Rumble','Fight','Ding ding','Ten seconds',
        'Workout complete. Well done.'
      ];
      vocab.forEach(word => {
        const u = new SpeechSynthesisUtterance(word);
        u.volume = 0;
        u.rate   = 1.1;
        const v  = getVoice();
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
      });
    }

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        loadVoices();
        preloadVocabulary();
      };
    }

    // ── Speech ────────────────────────────────────────────────────
    function safeSpeak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.1;
      const v = getVoice();
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    // Must be called from a user-gesture context (e.g. button click) to unlock
    // the audio context on iOS Safari before any timed speech fires.
    function unlockSpeech() {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    }

    function cancelSequenceSpeech() {
      seqTimeouts.forEach(clearTimeout);
      seqTimeouts = [];
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    // ── Formatting ────────────────────────────────────────────────
    function formatTime(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    // ── Drift-resistant timer ─────────────────────────────────────
    function startPhase(seconds) {
      phaseStart    = Date.now();
      phaseDuration = seconds;
    }

    function remaining() {
      return Math.max(0,
        phaseDuration - Math.floor((Date.now() - phaseStart) / 1000)
      );
    }

    // ── Settings UI ───────────────────────────────────────────────
    document.querySelectorAll('.rest-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        restTime = Number(btn.dataset.value);
        document.querySelectorAll('.rest-btn').forEach(b =>
          b.classList.toggle('active', b === btn)
        );
      })
    );

    document.querySelectorAll('.rounds-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        roundLimit = Number(btn.dataset.value);
        document.querySelectorAll('.rounds-btn').forEach(b =>
          b.classList.toggle('active', b === btn)
        );
      })
    );

    legendToggle.addEventListener('click', () => {
      const open = legendEl.classList.toggle('open');
      legendToggle.textContent = open ? '▲ Hide punch key' : '▼ Show punch key';
    });

    // ── Sequence generation ───────────────────────────────────────
    function triggerSequence() {
      if (mode !== 'round' || !isRunning) return;

      cancelSequenceSpeech();

      const seq    = [];
      let parity   = Math.random() > 0.5 ? 'even' : 'odd';
      let hasMove  = false;

      for (let i = 0; i < 4; i++) {
        if (!hasMove && roundMovementCount < 4 && Math.random() < 0.25) {
          const keys = Object.keys(MOVEMENTS);
          seq.push(keys[Math.floor(Math.random() * keys.length)]);
          hasMove = true;
          roundMovementCount++;
        } else {
          if (Math.random() < 0.8) parity = parity === 'even' ? 'odd' : 'even';
          const pool = PUNCH_POOL[parity];
          seq.push(pool[Math.floor(Math.random() * pool.length)]);
        }
      }

      sequenceEl.textContent = seq.join('-');

      // Queue each item 600 ms apart so they play back cleanly
      seq.forEach((item, i) => {
        const t = setTimeout(() => {
          if (mode !== 'round' || !isRunning || !window.speechSynthesis) return;
          const u = new SpeechSynthesisUtterance(MOVEMENTS[item] ?? String(item));
          u.rate = 1.1;
          const v = getVoice();
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        }, i * 600);
        seqTimeouts.push(t);
      });
    }

    // ── Phase transitions ─────────────────────────────────────────
    function startRound() {
      mode = 'round';
      currentRound++;
      roundMovementCount = 0;
      startPhase(ROUND_TIME);

      timerEl.classList.remove('timer-teal', 'flash-round', 'flash-rest');
      sequenceEl.textContent = '';
      roundEl.textContent = roundLimit
        ? `Round ${currentRound} / ${roundLimit}`
        : `Round ${currentRound}`;

      safeSpeak('Fight');

      if (comboInterval) { clearInterval(comboInterval); comboInterval = null; }
      triggerSequence();
      comboInterval = setInterval(triggerSequence, COMBO_EVERY * 1000);
    }

    function startRest() {
      mode          = 'rest';
      restWarnFired = false;
      startPhase(restTime);

      cancelSequenceSpeech();
      if (comboInterval) { clearInterval(comboInterval); comboInterval = null; }

      timerEl.classList.remove('timer-teal', 'flash-round', 'flash-rest');
      sequenceEl.textContent = 'REST';
      safeSpeak('Ding ding');
    }

    function completeWorkout() {
      isRunning = false;
      mode      = 'idle';

      clearInterval(mainInterval); mainInterval = null;
      if (comboInterval) { clearInterval(comboInterval); comboInterval = null; }
      cancelSequenceSpeech();

      timerEl.classList.remove('timer-teal', 'flash-round', 'flash-rest');
      timerEl.textContent    = '0:00';
      sequenceEl.textContent = '';
      roundEl.textContent    = `${currentRound} round${currentRound !== 1 ? 's' : ''} complete`;

      settingsEl.classList.remove('hidden');
      activeEl.classList.add('hidden');
      mainBtn.textContent = 'Start Workout';
      mainBtn.classList.remove('danger');

      safeSpeak('Workout complete. Well done.');
    }

    // ── Tick ──────────────────────────────────────────────────────
    function tick() {
      if (!isRunning) return;
      const r = remaining();
      timerEl.textContent = formatTime(r);

      if (mode === 'delay') {
        if (r === 2) safeSpeak('To');
        if (r === 1) safeSpeak('Rumble');
        if (r <= 0)  startRound();
      }
      else if (mode === 'round') {
        if (r <= 30) timerEl.classList.add('timer-teal', 'flash-round');
        if (r <= 0) {
          timerEl.classList.remove('timer-teal', 'flash-round');
          if (roundLimit > 0 && currentRound >= roundLimit) {
            completeWorkout();
          } else {
            startRest();
          }
        }
      }
      else if (mode === 'rest') {
        if (r <= 10 && !restWarnFired) {
          restWarnFired = true;
          timerEl.classList.add('flash-rest');
          safeSpeak('Ten seconds');
        }
        if (r <= 0) {
          timerEl.classList.remove('flash-rest');
          startRound();
        }
      }
    }

    // ── Workout control ───────────────────────────────────────────
    function startWorkout() {
      isRunning    = true;
      mode         = 'delay';
      currentRound = 0;
      startPhase(START_DELAY);

      settingsEl.classList.add('hidden');
      activeEl.classList.remove('hidden');
      mainBtn.textContent = 'Stop Workout';
      mainBtn.classList.add('danger');

      timerEl.textContent    = formatTime(START_DELAY);
      sequenceEl.textContent = '';
      roundEl.textContent    = 'Round 0';

      safeSpeak('Ready'); // also acts as iOS audio context unlock (called from user gesture)

      if (mainInterval) clearInterval(mainInterval);
      mainInterval = setInterval(tick, 1000);
    }

    function stopWorkout() {
      isRunning = false;
      mode      = 'idle';

      clearInterval(mainInterval); mainInterval = null;
      if (comboInterval) { clearInterval(comboInterval); comboInterval = null; }
      cancelSequenceSpeech();

      timerEl.classList.remove('timer-teal', 'flash-round', 'flash-rest');
      timerEl.textContent    = '0:00';
      sequenceEl.textContent = '';
      roundEl.textContent    = 'Round 0';

      settingsEl.classList.remove('hidden');
      activeEl.classList.add('hidden');
      mainBtn.textContent = 'Start Workout';
      mainBtn.classList.remove('danger');
    }

    mainBtn.addEventListener('click', () => {
      if (isRunning) stopWorkout();
      else startWorkout();
    });
  </script>
</body>
</html>
